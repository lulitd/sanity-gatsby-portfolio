packages:
  - web
  - studio

nodeLinker: isolated
shamefullyHoist: true

onlyBuiltDependencies:
  - sharp
overrides:
  "react-dev-utils@12.0.1>shell-quote": "1.12.0"
  "express@4.22.1>proxy-addr": "2.0.8"
  "ajv@8.18.0>fast-uri": "3.1.9"
  "minimatch@3.1.5>brace-expansion": "1.1.21"

  # JS-YAML security patches
  "js-yaml@^3.13.1": "3.15.2"
  "js-yaml@^4.0.0": "4.3.2"

  # Explicit exception for pinned dependency
  "@vercel/frameworks@3.29.0>js-yaml": "3.15.2"

  # Follow-redirects security patch
  "follow-redirects@^1.2.4": "1.16.2"

  # Axios 1.x security patch
  "gatsby@5.16.1>axios": "1.20.0"

  # Legacy Axios security patch — outside upstream declared range
  "gatsby-source-sanity@7.9.2>axios": "0.34.0"

  # Form-data security patch for legacy Axios
  "axios@0.34.0>form-data": "4.0.6"

  # Multer security patch
  "gatsby@5.16.1>multer": "2.5.0"

  # Engine.IO security patch
  "socket.io@4.8.3>engine.io": "6.6.10"

  # WebSocket security remediation through parent upgrades
  "socket.io-client@4.8.3>engine.io-client": "6.6.8"
  "socket.io@4.8.3>socket.io-adapter":
    "2.5.9"

    # SVGO 2.x security patch — CSS optimization
  "postcss-svgo@5.1.0>svgo": "2.8.4"

  # SVGO 3.x security patch — SVG component compilation
  "@svgr/plugin-svgo@8.1.0>svgo":
    "3.3.5"

    # Immutable security patch — Relay compiler
  # Outside parent's ~3.7.6 range
  "@ardatan/relay-compiler@12.0.0>immutable": "3.8.4"

  "gatsby@5.16.1>postcss": "8.5.33"
  "css-loader@5.2.7>postcss": "8.5.33"
  "css-minimizer-webpack-plugin@2.0.0>postcss": "8.5.33"
